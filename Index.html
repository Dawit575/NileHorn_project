<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My-First-Calculator!</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calculator">
        <input class="output-screen" id="display" readonly>

      <div class="Buttons">
          <button
          id="crear-btn"
          onclick="AllClear()">C</button>
          <button
          id="back-space"
          onclick="BackSpace()">⌫</button>
          <button
          class="operators"
          onclick="AppendOprators('/')">/</button>
          <button
          class="operators"
          onclick="AppendOprators('*')">*</button>
          <button
          class="numbers"
          onclick="AppendNumber('7')">7</button>
          <button
          class="numbers"
          onclick="AppendNumber('8')">8</button>
          <button
          class="numbers"
          onclick="AppendNumber('9')">9</button>
          <button
          class="operators"
          onclick="AppendOprators('-')">-</button>
          <button
          class="numbers"
          onclick="AppendNumber('4')">4</button>
          <button
          class="numbers"
          onclick="AppendNumber('5')">5</button>
          <button
          class="numbers"
          onclick="AppendNumber('6')">6</button>
          <button
          class="operators"
          onclick="AppendOprators('+')">+</button>
          <button
          class="numbers"
          onclick="AppendNumber('1')">1</button>
          <button
          class="numbers"
          onclick="AppendNumber('2')">2</button>
          <button
          class="numbers"
          onclick="AppendNumber('3')">3</button>
          <button
          class="operators"
          onclick="CalculateResult()">=</button>
          <button
          class="numbers"
          onclick="AppendNumber('0')">0</button>
          <button
          class="dotOperatror"
          onclick="AppendDot('.')">.</button>
      </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
